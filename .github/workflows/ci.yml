name: ASKR EV CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'

jobs:
  validate-test-build:
    name: Validate, Test & Build
    runs-on: ubuntu-latest
    env:
      COMPLIANCE_MODE: SIMULATION_ONLY
      ENABLE_LIVE_PAYOUTS: "false"
      JWT_ACCESS_SECRET: ci-access-secret-minimum-32-characters-test!
      JWT_REFRESH_SECRET: ci-refresh-secret-minimum-32-characters-test!
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/askrev_ci?schema=public"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Prisma Schema Validation
        run: pnpm --filter @askrev/database exec prisma validate

      - name: Generate Prisma Client
        run: pnpm --filter @askrev/database exec prisma generate

      - name: Build Shared Package
        run: pnpm --filter @askrev/shared run build

      - name: Build Database Package
        run: pnpm --filter @askrev/database run build

      - name: Run API Unit & Regression Tests
        run: pnpm --filter @askrev/api test

      - name: Build API Application
        run: pnpm --filter @askrev/api run build

      - name: Build Web Application
        run: pnpm --filter @askrev/web run build
