<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <!-- Studio Lighting Gradients -->
    <radialGradient id="studioFloor" cx="50%" cy="80%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </radialGradient>

    <!-- Ground Contact Shadows -->
    <radialGradient id="tireShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#334155" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#F8FAFC" stop-opacity="0" />
    </radialGradient>

    <!-- Paint Gradients: Sapphire Corporate Metallic -->
    <linearGradient id="sapphireMetallic" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="35%" stop-color="#165DAD" />
      <stop offset="70%" stop-color="#0F3B6C" />
      <stop offset="100%" stop-color="#082342" />
    </linearGradient>

    <!-- Deep Carbon & Matte Chassis -->
    <linearGradient id="matteCharcoal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Brushed Aluminum & Chrome -->
    <linearGradient id="brushedAlloy" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="30%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <!-- Brake Disc Gradient -->
    <radialGradient id="discMetal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#CBD5E1" />
      <stop offset="65%" stop-color="#94A3B8" />
      <stop offset="85%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#475569" />
    </radialGradient>

    <!-- Soft Drop Shadow Filter -->
    <filter id="chassisShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.20" />
    </filter>
  </defs>

  <!-- Ground Soft Shadows -->
  <ellipse cx="230" cy="385" rx="90" ry="16" fill="url(#tireShadow)" />
  <ellipse cx="580" cy="385" rx="90" ry="16" fill="url(#tireShadow)" />
  <ellipse cx="405" cy="392" rx="240" ry="14" fill="#334155" opacity="0.12" />

  <!-- ==================== REAR WHEEL ASSEMBLY ==================== -->
  <g id="rear-wheel">
    <!-- Outer Rubber Tire (18-inch radial) -->
    <circle cx="230" cy="320" r="76" fill="#1E293B" stroke="#0F172A" stroke-width="10" />
    <circle cx="230" cy="320" r="68" fill="none" stroke="#334155" stroke-width="2" />
    <!-- Alloy Rim -->
    <circle cx="230" cy="320" r="60" fill="#0F172A" stroke="#475569" stroke-width="4" />
    <!-- Perforated Brake Rotor -->
    <circle cx="230" cy="320" r="42" fill="url(#discMetal)" stroke="#334155" stroke-width="2" />
    <circle cx="230" cy="320" r="32" fill="#0F172A" />
    <!-- Rim Spokes (5-split sporty design) -->
    <line x1="230" y1="262" x2="230" y2="378" stroke="url(#brushedAlloy)" stroke-width="5" />
    <line x1="175" y1="288" x2="285" y2="352" stroke="url(#brushedAlloy)" stroke-width="5" />
    <line x1="175" y1="352" x2="285" y2="288" stroke="url(#brushedAlloy)" stroke-width="5" />
    <!-- Central Hub & Sprocket -->
    <circle cx="230" cy="320" r="18" fill="#1E293B" stroke="#64748B" stroke-width="2" />
    <circle cx="230" cy="320" r="8" fill="#165DAD" />
    <!-- Brake Caliper (Sport Red) -->
    <rect x="200" y="300" width="16" height="30" rx="3" fill="#DC2626" stroke="#991B1B" stroke-width="1" />
  </g>

  <!-- ==================== FRONT WHEEL ASSEMBLY ==================== -->
  <g id="front-wheel">
    <!-- Outer Rubber Tire (17-inch radial) -->
    <circle cx="580" cy="320" r="76" fill="#1E293B" stroke="#0F172A" stroke-width="10" />
    <circle cx="580" cy="320" r="68" fill="none" stroke="#334155" stroke-width="2" />
    <!-- Alloy Rim -->
    <circle cx="580" cy="320" r="60" fill="#0F172A" stroke="#475569" stroke-width="4" />
    <!-- Large Front Dual Floating Brake Rotor -->
    <circle cx="580" cy="320" r="48" fill="url(#discMetal)" stroke="#334155" stroke-width="2" />
    <circle cx="580" cy="320" r="36" fill="#0F172A" />
    <!-- Rim Spokes -->
    <line x1="580" y1="262" x2="580" y2="378" stroke="url(#brushedAlloy)" stroke-width="5" />
    <line x1="525" y1="288" x2="635" y2="352" stroke="url(#brushedAlloy)" stroke-width="5" />
    <line x1="525" y1="352" x2="635" y2="288" stroke="url(#brushedAlloy)" stroke-width="5" />
    <!-- Hub -->
    <circle cx="580" cy="320" r="18" fill="#1E293B" stroke="#64748B" stroke-width="2" />
    <circle cx="580" cy="320" r="8" fill="#165DAD" />
    <!-- Radial Brake Caliper -->
    <rect x="588" y="302" width="18" height="32" rx="3" fill="#DC2626" stroke="#991B1B" stroke-width="1" />
  </g>

  <!-- ==================== REAR SWINGARM & DRIVE ==================== -->
  <path d="M 230 320 L 380 305 L 375 330 L 235 330 Z" fill="#334155" stroke="#1E293B" stroke-width="2" />
  <!-- Rear Mono-Shock Suspension with Coil Spring -->
  <line x1="335" y1="295" x2="365" y2="250" stroke="#E2E8F0" stroke-width="10" stroke-linecap="round" />
  <line x1="335" y1="295" x2="365" y2="250" stroke="#DC2626" stroke-width="7" stroke-dasharray="4,4" />

  <!-- ==================== BATTERY PACK & ELECTRIC MOTOR ==================== -->
  <!-- Heavy Structural Battery Casement -->
  <polygon points="280,320 460,320 490,230 320,230" fill="url(#matteCharcoal)" stroke="#475569" stroke-width="2" />
  <!-- Battery Core Ribbed Cooling Fins -->
  <line x1="315" y1="245" x2="475" y2="245" stroke="#475569" stroke-width="2" />
  <line x1="310" y1="260" x2="470" y2="260" stroke="#475569" stroke-width="2" />
  <line x1="305" y1="275" x2="465" y2="275" stroke="#475569" stroke-width="2" />
  <line x1="300" y1="290" x2="460" y2="290" stroke="#475569" stroke-width="2" />
  <line x1="295" y1="305" x2="455" y2="305" stroke="#475569" stroke-width="2" />
  <!-- Central PMSM Electric Motor Housing -->
  <circle cx="380" cy="315" r="32" fill="#0F172A" stroke="url(#brushedAlloy)" stroke-width="3" />
  <circle cx="380" cy="315" r="22" fill="#1E293B" />
  <text x="380" y="319" fill="#94A3B8" font-size="8" font-weight="800" text-anchor="middle" font-family="Inter, sans-serif">PMSM</text>

  <!-- ==================== TRELLIS CHASSIS FRAME ==================== -->
  <path d="M 330 230 L 410 270 L 480 215 L 530 180" fill="none" stroke="#DC2626" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="370" y1="250" x2="450" y2="245" stroke="#DC2626" stroke-width="4" />

  <!-- ==================== MAIN SCULPTED BODYWORK ==================== -->
  <!-- Aerodynamic Tank & Side Fairings in Sapphire Blue -->
  <path d="M 260 215 C 300 215, 340 185, 420 155 C 470 145, 520 160, 545 200 C 510 235, 460 260, 390 260 C 330 260, 280 235, 260 215 Z" 
        fill="url(#sapphireMetallic)" filter="url(#chassisShadow)" stroke="#3B82F6" stroke-width="1.5" />

  <!-- Sharp Aerodynamic Shoulder Inset -->
  <path d="M 430 170 L 510 185 L 480 220 L 410 200 Z" fill="#1E40AF" opacity="0.6" />

  <!-- Minimal Brand Emblems -->
  <text x="445" y="195" fill="#FFFFFF" font-size="12" font-weight="900" letter-spacing="2" font-family="Inter, sans-serif">ASKR</text>
  <text x="445" y="208" fill="#93C5FD" font-size="8" font-weight="700" letter-spacing="1.5" font-family="Inter, sans-serif">THUNDER PRO</text>

  <!-- ==================== SEAT & TAIL SECTION ==================== -->
  <!-- Raised Sports Tail Cowl -->
  <path d="M 200 190 L 270 205 L 260 220 L 190 200 Z" fill="url(#sapphireMetallic)" stroke="#1D4ED8" stroke-width="1" />
  <!-- LED Slim Tail Brake Light Strip -->
  <line x1="192" y1="196" x2="202" y2="198" stroke="#EF4444" stroke-width="4" stroke-linecap="round" />
  <!-- Ergonomic Perforated Black Leather Saddle -->
  <path d="M 260 205 Q 320 200 370 215 L 360 228 Q 310 215 255 220 Z" fill="#0F172A" />

  <!-- ==================== FRONT FORK & STEERING ==================== -->
  <!-- Inverted Telescopic Front Suspension (Gold/Bronze Stanchions) -->
  <line x1="535" y1="175" x2="578" y2="315" stroke="#D97706" stroke-width="7" stroke-linecap="round" />
  <line x1="542" y1="175" x2="585" y2="315" stroke="#F59E0B" stroke-width="6" stroke-linecap="round" />
  <!-- Lower Stanchion Sliders -->
  <line x1="565" y1="265" x2="582" y2="322" stroke="#1E293B" stroke-width="10" stroke-linecap="round" />

  <!-- Triple Tree Clamps -->
  <rect x="525" y="172" width="28" height="8" rx="2" fill="#475569" stroke="#94A3B8" stroke-width="1" />
  <rect x="532" y="195" width="28" height="8" rx="2" fill="#475569" stroke="#94A3B8" stroke-width="1" />

  <!-- Handlebars & Controls -->
  <line x1="520" y1="165" x2="540" y2="175" stroke="#334155" stroke-width="6" stroke-linecap="round" />
  <circle x="518" y="164" r="5" fill="#0F172A" />
  <path d="M 520 163 L 508 168" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" />

  <!-- Aerodynamic Front Fender / Mudguard -->
  <path d="M 540 270 Q 580 250 625 285" fill="none" stroke="url(#sapphireMetallic)" stroke-width="7" stroke-linecap="round" />

  <!-- ==================== HEADLIGHT COWL ==================== -->
  <polygon points="535,175 570,185 580,215 548,225" fill="url(#sapphireMetallic)" stroke="#1D4ED8" stroke-width="1" />
  <!-- Twin Projector LED Headlamps -->
  <ellipse cx="568" cy="202" rx="4" ry="7" fill="#60A5FA" />
  <ellipse cx="568" cy="202" rx="2" ry="4" fill="#FFFFFF" />
  <line x1="558" y1="188" x2="574" y2="194" stroke="#93C5FD" stroke-width="2.5" stroke-linecap="round" />

  <!-- Footpeg & Gear Shift Control Detail -->
  <circle cx="340" cy="305" r="4" fill="#E2E8F0" />
  <line x1="340" y1="305" x2="330" y2="315" stroke="#64748B" stroke-width="3" stroke-linecap="round" />
</svg>
